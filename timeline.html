<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="global.css">
  <script src="https://timeline-api.gcc3.com/timeline/2.3.1/timeline-api.js" type="text/javascript"></script>
  <script src="config.js" type="text/javascript"></script>
  <script src="langs.js" type="text/javascript"></script>

  <script>
    // Language preference is stored in localStorage
    function getLang() {
      try { return localStorage.getItem('locale'); } catch (e) { return null; }
    }

    function setLang(lang) {
      try { localStorage.setItem('locale', lang); } catch (e) {}
      location.reload();
    }

    // Resolve current language and load its data file (data.js for en, data.<lang>.js otherwise)
    if (typeof langs === 'undefined') var langs = ['en'];  // normally defined in langs.js (run setup.sh)
    var lang = getLang();
    if (langs.indexOf(lang) === -1) lang = 'en';
    var dataFile = lang === 'en' ? 'data.js' : 'data.' + lang + '.js';
    document.write('<script src="' + dataFile + '" type="text/javascript"><\/script>');
  </script>

  <script>
    var tl = null;
    function onLoad() {
      document.getElementById("title").innerText = title;
      document.title = title;

      // Build the language switcher from langs (langs.js)
      var sw = document.getElementById("lang-switch");
      for (var i = 0; i < langs.length; i++) {
        var a = document.createElement("a");
        a.href = "javascript:setLang('" + langs[i] + "')";
        a.innerText = langs[i].toUpperCase();
        if (langs[i] === lang) a.className = "active";
        sw.appendChild(a);
      }

      tl = tl_init();
    }

    var resizeTimerID = null;
    function onResize() {
      // Seems not useable
      if (resizeTimerID == null) {
        resizeTimerID = window.setTimeout(function () {
          resizeTimerID = null;
          tl.layout();
        }, 500);
      }
    }
  </script>
</head>

<body onload="onLoad()" onresize="onResize()">
  <div style="font-size: small; margin-top: 10px; display: flex; height: 20px">
    <div id="title" style="margin-bottom: 3px">HISTORY TIMELINE</div>
    <div id="lang-switch" style="margin-left: auto"></div>
  </div>

  <div id="timeline" style="border: 1px solid #aaa; font-size: x-small;"></div>
  <div style="font-size: x-small;margin-top: 3px">
    Please install font
    <a href="https://www.microsoft.com/en-us/p/%E6%9B%B4%E7%BA%B1%E9%BB%91%E4%BD%93/9mw0m424ncz7?activetab=pivot:overviewtab">
      Sarasa Mono SC
    </a>
  </div>
</body>

</html>
