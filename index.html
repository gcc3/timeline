<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<head>
  <meta charset="UTF-8">
  <!-- Must precede timeline-api.js: SimileAjax.History copies document.title
       as it loads and restores that copy later, so an absent title wins. -->
  <title>TIMELINE</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://timeline-api.gcc3.com/timeline/2.3.1/timeline-api.js" type="text/javascript"></script>
  <script src="config.js" type="text/javascript"></script>
  <script src="langs.js" type="text/javascript"></script>
  <script src="app.js" type="text/javascript"></script>
</head>

<body onload="onLoad()" onresize="onResize()">
  <!-- Covers the page while the data file downloads and the timeline is
       built; removed at the end of onDataLoaded() in app.js. -->
  <div id="loading">
    <div id="loading-spinner"></div>
    <div>Loading...</div>
  </div>

  <div style="font-size: small; margin-top: 10px; display: flex; height: 20px">
    <div id="title" style="margin-bottom: 3px">HISTORY TIMELINE</div>
    <div id="lang-switch" style="margin-left: auto"></div>
  </div>

  <div id="timeline" style="border: 1px solid #aaa; font-size: x-small;"></div>
  <div style="font-size: x-small;margin-top: 3px">
    powered by
    <a href="https://simile.mit.edu/timeline/">
      SIMILE
    </a>
  </div>
</body>

</html>
